<svg xmlns="http://www.w3.org/2000/svg" width="640" height="212" viewBox="0 0 640 212" role="img" aria-labelledby="title desc">
  <title id="title">Memory used by OpenCode with ten idle windows</title>
  <desc id="desc">Ten idle windows: 894 MiB awake, 3 MiB napping. OpenCode in total, server included: 1,172 MiB awake, 294 MiB napping.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .heading { font-weight: 600; }
    .muted { fill: #59636e; }
    .awake { fill: #afb8c1; }
    .nap { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .awake { fill: #3d444d; }
      .nap { fill: #4493f8; }
    }
  </style>

  <text class="heading" x="0" y="18">Ten idle windows</text>
  <text class="muted" x="0" y="50">Awake</text>
  <rect class="awake" x="80" y="35" width="366" height="20" rx="3"/>
  <text x="456" y="50">894 MiB</text>
  <text class="muted" x="0" y="80">Napping</text>
  <rect class="nap" x="80" y="65" width="2" height="20" rx="1"/>
  <text x="92" y="80">3 MiB</text>

  <text class="heading" x="0" y="128">OpenCode in total, server included</text>
  <text class="muted" x="0" y="160">Awake</text>
  <rect class="awake" x="80" y="145" width="480" height="20" rx="3"/>
  <text x="570" y="160">1,172 MiB</text>
  <text class="muted" x="0" y="190">Napping</text>
  <rect class="nap" x="80" y="175" width="120" height="20" rx="3"/>
  <text x="210" y="190">294 MiB</text>
</svg>
